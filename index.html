<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Expense Tracker</h1>

        <h3>Your Balance</h3>
         <h2 id="balance">$0.00</h2>

        <div class="income-expenses">
            <div class="income-box">
                <h4>income</h4>
                <p id="income">$0.00</p>
            </div>
            <div class="expenses-box">
                <h4>expenses</h4>
                <p id="expenses"> $0.00</p>
            </div>
        </div>
        <h3>History</h3>

        <ul id="transaction-list">

   
        </ul>
        <h3>Add New Transaction</h3>

        <form id="form">
            <label for="text">Desciption</label>
            <input type="text" id="text" placeholder="Enter Description">

            <label for="amount">
                Amount <br>
                (Positive = Income, Negative = Expenses)
            </label>

            <input type="text" placeholder="Enter amount" id="amount">

            <button type="submit" id="add-btn">Add Transaction</button>
        </form>



    </div>
    <script src="script.js"></script>
</body>
</html>
